packages:
  - apps/*
  - packages/*

# pnpm 10 bloqueia scripts de instalação por padrão; libere aqui só o necessário.
onlyBuiltDependencies:
  - esbuild
  # Binários do PostgreSQL local de dev (pnpm db:dev): o postinstall recria symlinks no Linux/macOS.
  - '@embedded-postgres/darwin-arm64'
  - '@embedded-postgres/darwin-x64'
  - '@embedded-postgres/linux-arm64'
  - '@embedded-postgres/linux-x64'
  - '@embedded-postgres/windows-x64'
