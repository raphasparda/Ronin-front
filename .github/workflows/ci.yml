# CI do Ronin: lint, typecheck, testes (com PostgreSQL real) e build; E2E em job separado.
# Detalhes, variáveis e como reproduzir localmente: docs/ops/ci.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo na mesma branch/PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nunca subir o PostgreSQL embutido (scripts/dev-db/postgres.mjs): o CI usa só o serviço abaixo.
  DEV_DB_EXTERNAL_ONLY: 'true'
  # Serviço postgres:18-alpine publicado na 5432 do runner. Credenciais descartáveis, só do CI.
  DATABASE_URL: postgres://kanban:kanban@127.0.0.1:5432/kanban
  TEST_DATABASE_URL: postgres://kanban:kanban@127.0.0.1:5432/kanban_test
  E2E_DATABASE_URL: postgres://kanban:kanban@127.0.0.1:5432/kanban_e2e
  APP_ORIGIN: http://127.0.0.1:5310
  LOG_LEVEL: warn

jobs:
  checks:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanban -d kanban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Sem `version`: usa o `packageManager` do package.json (pnpm@10.x).
      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Instalar Node.js (.nvmrc) com cache do store do pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Criar banco de testes (kanban_test)
        run: docker exec "${{ job.services.postgres.id }}" psql -U kanban -d kanban -v ON_ERROR_STOP=1 -c "CREATE DATABASE kanban_test OWNER kanban"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
          POSTGRES_DB: kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanban -d kanban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Instalar Node.js (.nvmrc) com cache do store do pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Criar banco E2E (kanban_e2e)
        run: docker exec "${{ job.services.postgres.id }}" psql -U kanban -d kanban -v ON_ERROR_STOP=1 -c "CREATE DATABASE kanban_e2e OWNER kanban"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium do Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      # e2e/run.mjs aplica as migrations em kanban_e2e e roda o Playwright (API 3100, web 5320).
      - name: E2E
        run: pnpm test:e2e

      - name: Publicar relatório e traces (falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
