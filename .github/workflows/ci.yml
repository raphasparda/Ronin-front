# CI do ronin-web: lint, typecheck, testes de componentes e build; E2E (Playwright) em job separado,
# subindo a API do repositório ronin-api com um PostgreSQL de serviço.
# Detalhes, variáveis, segredos e como reproduzir localmente: docs/ops/ci.md.
#
# Os dois jobs fazem checkout do ronin-api ao lado deste repositório (ronin-web/ e ronin-api/ no
# workspace), porque o @raphasparda/ronin-shared vem de `link:../ronin-api/packages/shared`.
# Configuração no GitHub (Settings -> Secrets and variables -> Actions):
#   - variável RONIN_API_REPOSITORY (opcional): repositório da API; padrão: raphasparda/Ronin-End
#   - variável RONIN_API_REF (opcional): branch/tag do ronin-api; padrão: main
#   - segredo RONIN_API_TOKEN (obrigatório se o ronin-api for privado): fine-grained PAT com
#     "Contents: Read-only" só no Ronin-End. Sem ele, usa o GITHUB_TOKEN (serve só se for público).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo na mesma branch/PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RONIN_API_REPOSITORY: ${{ vars.RONIN_API_REPOSITORY || 'raphasparda/Ronin-End' }}
  RONIN_API_REF: ${{ vars.RONIN_API_REF || 'main' }}
  RONIN_API_DIR: ${{ github.workspace }}/ronin-api

defaults:
  run:
    working-directory: ronin-web

jobs:
  checks:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout (ronin-web)
        uses: actions/checkout@v7
        with:
          path: ronin-web
          persist-credentials: false

      - name: Checkout (ronin-api, fonte do @raphasparda/ronin-shared)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.RONIN_API_REPOSITORY }}
          ref: ${{ env.RONIN_API_REF }}
          token: ${{ secrets.RONIN_API_TOKEN || github.token }}
          path: ronin-api
          persist-credentials: false

      # Sem `version`: usa o `packageManager` do package.json (pnpm@10.x).
      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ronin-web/package.json

      - name: Instalar Node.js (.nvmrc) com cache do store do pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: ronin-web/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            ronin-web/pnpm-lock.yaml
            ronin-api/pnpm-lock.yaml

      # O zod usado pela fonte do shared é resolvido a partir de ronin-api/node_modules.
      - name: Instalar dependências (ronin-api)
        working-directory: ronin-api
        run: pnpm install --frozen-lockfile

      - name: Instalar dependências (ronin-web)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Nunca subir o PostgreSQL embutido do ronin-api: o CI usa só o serviço abaixo.
      DEV_DB_EXTERNAL_ONLY: 'true'
      # Serviço postgres:18-alpine publicado na 5432 do runner. Credenciais descartáveis, só do CI.
      DATABASE_URL: postgres://ronin:ronin@127.0.0.1:5432/ronin
      E2E_DATABASE_URL: postgres://ronin:ronin@127.0.0.1:5432/ronin_e2e
      APP_ORIGIN: http://127.0.0.1:5310
      LOG_LEVEL: warn

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ronin
          POSTGRES_PASSWORD: ronin
          POSTGRES_DB: ronin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ronin -d ronin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout (ronin-web)
        uses: actions/checkout@v7
        with:
          path: ronin-web
          persist-credentials: false

      - name: Checkout (ronin-api)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.RONIN_API_REPOSITORY }}
          ref: ${{ env.RONIN_API_REF }}
          token: ${{ secrets.RONIN_API_TOKEN || github.token }}
          path: ronin-api
          persist-credentials: false

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ronin-web/package.json

      - name: Instalar Node.js (.nvmrc) com cache do store do pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: ronin-web/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            ronin-web/pnpm-lock.yaml
            ronin-api/pnpm-lock.yaml

      - name: Criar banco E2E (ronin_e2e)
        run: docker exec "${{ job.services.postgres.id }}" psql -U ronin -d ronin -v ON_ERROR_STOP=1 -c "CREATE DATABASE ronin_e2e OWNER ronin"

      - name: Instalar dependências (ronin-api)
        working-directory: ronin-api
        run: pnpm install --frozen-lockfile

      - name: Instalar dependências (ronin-web)
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      # e2e/run.mjs aplica as migrations do ronin-api em ronin_e2e e roda o Playwright
      # (API do ronin-api na 3100, web na 5320).
      - name: E2E
        run: pnpm test:e2e

      - name: Publicar relatório e traces (falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ronin-web/playwright-report
            ronin-web/test-results
          retention-days: 7
          if-no-files-found: ignore
